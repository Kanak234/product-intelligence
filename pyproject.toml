[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-intelligence"
version = "1.0.0"
description = "Product Catalog Intelligence, Taxonomy Inference & Deterministic Specification Extraction Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.37",
    "pypdf>=4.2.0",
    "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["product_intelligence*", "pi_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
